name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run control-flow tests
        run: |
          python3 test_controller.py
          python3 gui/test_gui_control.py
          python3 gui/test_permission_control.py

      - name: Decide whether this build is a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater only installs a DMG whose app version equals the release tag.
          version=$(sed -n 's/^VERSION=//p' gui/build-dmg.sh)
          fallback=$(sed -n 's/^let fallbackAppVersion = "\(.*\)"$/\1/p' gui/Updater.swift)
          [[ "$fallback" == "$version" ]] || {
            echo "::error::build-dmg.sh VERSION=$version does not match Updater.swift $fallback"; exit 1; }
          release=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"; exit 1; }
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # A version bump merged to main publishes v$version once; later pushes only build.
            gh release view "v$version" >/dev/null 2>&1 || release=true
          fi
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build and self-test the app and DMG
        run: |
          if [[ "$RELEASE" == true ]]; then label="$RELEASE_TAG"; else label="$(git rev-parse --short HEAD)"; fi
          echo "DMG_NAME=SurgeDisconnectGuard-$label.dmg" >> "$GITHUB_ENV"
          mkdir -p dist
          ./gui/build-dmg.sh "$RUNNER_TEMP/build" "$PWD/dist/SurgeDisconnectGuard-$label.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: dist/${{ env.DMG_NAME }}
          if-no-files-found: error

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$DMG_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$DMG_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
