# Installed as /etc/newsyslog.d/local.surgedisconnect.conf. Rotates at 1 MB and keeps 5
# uncompressed copies. The guard reopens its log after rotation; N = no signal to send.
# logfilename                           [owner:group]  mode  count  size(KB)  when  flags
/var/log/surge-disconnect-guard.log     root:wheel     600   5      1024      *     N
/var/log/surge-disconnect-control.log   root:wheel     600   5      1024      *     N
